services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      APP_DEBUG: "false"
      SERP_PROVIDER: ${SERP_PROVIDER:-ddg_fallback}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PSI_API_KEY: ${PSI_API_KEY:-}
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      ENTERPRISE_API_KEYS: ${ENTERPRISE_API_KEYS:-}
      PLATFORM_DB: /app/intent_entity_platform/data/platform.sqlite3
    volumes:
      - ./intent_entity_platform/data:/app/intent_entity_platform/data
    restart: unless-stopped
